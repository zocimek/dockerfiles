---
name: "[build] cezar"

on:
  push:
    branches: [main]
    paths:
      - cezar/**
      - .github/workflows/build-cezar.yaml
  pull_request:
    paths:
      - cezar/**
      - .github/workflows/build-cezar.yaml
  workflow_dispatch:

concurrency:
  group: build-cezar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cezar

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve tags
        id: meta
        run: |
          version=$(sed -n 's/^ARG CEZAR_VERSION=//p' cezar/Dockerfile)
          test -n "$version"
          {
            echo "version=$version"
            echo "tags=${IMAGE}:${version},${IMAGE}:sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: cezar
          platforms: linux/amd64
          load: true
          tags: cezar:smoke
          cache-from: type=gha,scope=cezar
          cache-to: type=gha,scope=cezar,mode=max
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh cezar:smoke -c '
            set -ex
            id
            node --version
            cezar --help >/dev/null
            claude --version
            codex --version
            docker --version
            docker compose version
            mise ls
            go version
            python3 --version
            uv --version
            gh --version
            kubectl version --client
            helm version
            flux --version
            tofu --version
            terraform --version
            minijinja-cli --version
            psql --version
            mysql --version
            redis-cli --version
            mongosh --version
            fd --version
          '

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: cezar
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cezar
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
